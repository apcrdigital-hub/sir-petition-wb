<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIR Electoral Roll Appeal Representation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #f0f2f5;
      color: #1c1e21;
      padding: 24px 16px;
      line-height: 1.5;
    }
    .container {
      max-width: 540px;
      margin: 0 auto;
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0b3d91;
      margin-bottom: 8px;
      text-align: center;
    }
    p.subtitle {
      font-size: 13px;
      color: #606770;
      margin-bottom: 24px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }
    label span.required {
      color: #d93025;
    }
    input[type="text"],
    input[type="tel"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1.5px solid #ccd0d5;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus,
    input[type="tel"]:focus {
      border-color: #0b3d91;
      box-shadow: 0 0 0 2px rgba(11, 61, 145, 0.15);
    }
    .btn-submit {
      width: 100%;
      background-color: #0b3d91;
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }
    .btn-submit:hover {
      background-color: #082d6b;
    }
    .notice {
      margin-top: 18px;
      font-size: 12px;
      color: #65676b;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SIR Restoration Representation</h1>
    <p class="subtitle">Fill in your mandatory details to generate the official representation email.</p>

    <form id="appealForm" onsubmit="generateAndSendEmail(event)">
      <div class="form-group">
        <label for="fullName">Full Name <span class="required">*</span></label>
        <input type="text" id="fullName" placeholder="e.g. Rahul Mondal" required>
      </div>

      <div class="form-group">
        <label for="epicNo">EPIC No. (Voter ID No.) <span class="required">*</span></label>
        <input type="text" id="epicNo" placeholder="e.g. WBF1234567" style="text-transform: uppercase;" required>
      </div>

      <div class="form-group">
        <label for="acDetails">AC Name & No. <span class="required">*</span></label>
        <input type="text" id="acDetails" placeholder="e.g. 115 - Entally" required>
      </div>

      <div class="form-group">
        <label for="district">District <span class="required">*</span></label>
        <input type="text" id="district" placeholder="e.g. Kolkata" required>
      </div>

      <div class="form-group">
        <label for="appealNo">Tribunal Appeal No. <span class="required">*</span></label>
        <input type="text" id="appealNo" placeholder="e.g. TAT/2026/00123" required>
      </div>

      <div class="form-group">
        <label for="mobileNo">Mobile Number <span class="required">*</span></label>
        <input type="tel" id="mobileNo" placeholder="e.g. 98XXXXXXXX" pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" required>
      </div>

      <button type="submit" class="btn-submit">Generate & Open Email Draft</button>
    </form>

    <p class="notice">
      Tapping the button will launch your phone's email app (Gmail, Apple Mail, etc.) with all recipients, subject, and customized text filled in ready for your final review.
    </p>
  </div>

  <script>
    function generateAndSendEmail(event) {
      event.preventDefault();

      // Retrieve form values
      const fullName = document.getElementById("fullName").value.trim();
      const epicNo = document.getElementById("epicNo").value.trim().toUpperCase();
      const acDetails = document.getElementById("acDetails").value.trim();
      const district = document.getElementById("district").value.trim();
      const appealNo = document.getElementById("appealNo").value.trim();
      const mobileNo = document.getElementById("mobileNo").value.trim();

      // Email configuration
      const toAddresses = "ceo_westbengal@eci.gov.in,ceo-election-wb@nic.in,cec@eci.gov.in,ecsss@eci.gov.in,ecvj@eci.gov.in";
      const ccAddresses = "apcrbengal@gmail.com,complaints@eci.gov.in";
      const subject = "Request for Immediate Restoration of Name Excluded During SIR";

      // Formatted body with injected user values
      const bodyTemplate = 
`Respected Sir/Madam,

I respectfully submit that my name has been excluded from the Electoral Roll during the SIR process. And as such I  have also filed an appeal before the concerned Appellate Tribunal against the said exclusion of my name from the electoral roll under the disguise of Special Intensive Revision 2026.

Name: ${fullName}
Epic no: ${epicNo}
AC Name & No.: ${acDetails}
District: ${district}
Tribunal Appeal No.: ${appealNo}

Since serious questions and concerns have arisen regarding the procedure adopted during the SIR process as a whole, including the exclusion of names, I request that my case be urgently reviewed by the Appellate Tribunal authority, I have exercised my right to vote in the previous parliamentary elections 2024, whereas my name was excluded with a remark of logical discrepancy, being an Indian National by birth I very sincerely plead before your good office for the restoration of my name in the Electoral Roll without further delay.

I trust that  I will not be deprived of the right to vote due to any procedural error or system-related issue during the SIR process.

And whereas I have submitted all relevant documents related to me issued by competent authority time to time in my favour, during the filing of an individual appeal before the appellate tribunal authority, and also whereas if required I shall submit the same for reverification and re-inclusion of my name in  the electoral roll.

Yours faithfully,
${fullName}
${mobileNo}`;

      // Assemble URI and trigger mail client
      const mailtoUrl = `mailto:${toAddresses}?cc=${encodeURIComponent(ccAddresses)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyTemplate)}`;

      window.location.href = mailtoUrl;
    }
  </script>
</body>
</html>
